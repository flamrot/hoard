name: Build Hoard

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Build Hoard.exe
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Smoke test
        run: python packaging/smoke_test.py dist/Hoard.exe --trash
      - uses: actions/upload-artifact@v4
        with: { name: hoard-windows, path: dist/Hoard.exe }

  macos:
    runs-on: macos-latest          # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Build Hoard.app and .dmg
        run: |
          chmod +x packaging/build_macos.sh
          VERSION="${HOARD_TAG#v}" ./packaging/build_macos.sh
        env: { HOARD_TAG: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}" }
      - name: Smoke test
        run: python3 packaging/smoke_test.py dist/Hoard.app/Contents/MacOS/Hoard --trash
      - uses: actions/upload-artifact@v4
        with: { name: hoard-macos, path: dist/*.dmg }

  linux:
    runs-on: ubuntu-22.04          # oldest glibc we support; the AppImage runs on newer distros too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Build AppImage and .deb
        run: |
          sudo apt-get update && sudo apt-get install -y file
          chmod +x packaging/build_linux.sh
          VERSION="${HOARD_TAG#v}" ./packaging/build_linux.sh
        env: { HOARD_TAG: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0' }}" }
      - name: Smoke test (AppImage and installed .deb)
        run: |
          chmod +x dist/*.AppImage
          # CI runners have no FUSE, so let the AppImage unpack itself instead of mounting
          python3 packaging/smoke_test.py dist/*.AppImage --appimage-extract-and-run --trash
          sudo apt-get install -y ./dist/*.deb
          python3 packaging/smoke_test.py /usr/bin/hoard --trash
      - uses: actions/upload-artifact@v4
        with:
          name: hoard-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
