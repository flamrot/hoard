name: Build Hoard

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Unit tests (Python and Rust)
        run: |
          python -m unittest discover -s tests -v
          cargo test --release --manifest-path native/Cargo.toml
      - name: Build Hoard.exe (with the Rust scanners; signed if a certificate secret is set)
        shell: pwsh
        run: ./packaging/build_windows.ps1
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Smoke test
        run: python packaging/smoke_test.py dist/Hoard.exe --trash
      - uses: actions/upload-artifact@v4
        with: { name: hoard-windows, path: dist/Hoard.exe }

  macos:
    # Intel (x86_64, also runs on Apple Silicon via Rosetta) and native Apple Silicon (arm64).
    # Apple Silicon runners are often queued for a long time, so each one is allowed to fail on its own.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Unit tests (Python and Rust)
        run: |
          python3 -m unittest discover -s tests -v
          cargo test --release --manifest-path native/Cargo.toml
      - name: Build Hoard.app and .dmg
        run: |
          chmod +x packaging/build_macos.sh
          VERSION="${HOARD_TAG#v}" ./packaging/build_macos.sh
        env:
          HOARD_TAG: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}"
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - name: Smoke test
        run: python3 packaging/smoke_test.py dist/Hoard.app/Contents/MacOS/Hoard --trash
      - uses: actions/upload-artifact@v4
        with: { name: "hoard-${{ matrix.os }}", path: dist/*.dmg }

  linux:
    runs-on: ubuntu-22.04          # oldest glibc we support; the AppImage runs on newer distros too
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Unit tests (Python and Rust)
        run: |
          python3 -m unittest discover -s tests -v
          cargo test --release --manifest-path native/Cargo.toml
      - name: Build AppImage and .deb
        run: |
          sudo apt-get update && sudo apt-get install -y file
          chmod +x packaging/build_linux.sh
          VERSION="${HOARD_TAG#v}" ./packaging/build_linux.sh
        env: { HOARD_TAG: "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.1.0' }}" }
      - name: Smoke test (AppImage and installed .deb)
        run: |
          chmod +x dist/*.AppImage
          # CI runners have no FUSE, so let the AppImage unpack itself instead of mounting
          python3 packaging/smoke_test.py dist/*.AppImage --appimage-extract-and-run --trash
          sudo apt-get install -y ./dist/*.deb
          python3 packaging/smoke_test.py /usr/bin/hoard --trash
          # and the Python fallback scanner
          HOARD_NO_NATIVE=1 python3 packaging/smoke_test.py /usr/bin/hoard
      - uses: actions/upload-artifact@v4
        with:
          name: hoard-linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Checksums (Hoard's updater refuses downloads without a matching one)
        run: cd artifacts && for f in *; do sha256sum "$f" | cut -d' ' -f1 > "$f.sha256"; done
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
