<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='18' height='30' rx='3' fill='%233987e5'/%3E%3Crect x='21' y='1' width='10' height='17' rx='3' fill='%23d95926'/%3E%3Crect x='21' y='20' width='10' height='11' rx='3' fill='%23199e70'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --page: #f1f0ec;
  --surface: #fcfcfb;
  --surface-2: #f6f5f2;
  --frame-1: #e4e2db;
  --frame-2: #d8d6ce;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --line: #e1e0d9;
  --line-2: #c3c2b7;
  --hover: rgba(11,11,11,.05);
  --accent: #2a78d6;
  --accent-soft: rgba(42,120,214,.12);
  --danger: #c23434;
  --danger-soft: rgba(208,59,59,.10);
  --grow: #b9481c;
  --shrink: #006300;
  --ring: #0b0b0b;
  --c0: #2a78d6; --c1: #eb6834; --c2: #1baf7a; --c3: #eda100; --c4: #e87ba4;
  --c5: #008300; --c6: #6250d6; --c7: #e34948; --c8: #b4b2aa;
  --shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px rgba(0,0,0,.12);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, "Ubuntu", "Cantarell", "Noto Sans", sans-serif;
  --mono: "Cascadia Mono", "Cascadia Code", Consolas, "SF Mono", Menlo, "Ubuntu Mono", "DejaVu Sans Mono", ui-monospace, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #151514;
    --frame-1: #262625; --frame-2: #30302e;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
    --line: #2c2c2a; --line-2: #383835; --hover: rgba(255,255,255,.05);
    --accent: #3987e5; --accent-soft: rgba(57,135,229,.16);
    --danger: #e66767; --danger-soft: rgba(230,103,103,.12);
    --grow: #ec835a; --shrink: #0ca30c; --ring: #ffffff;
    --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181;
    --c5: #008300; --c6: #9085e9; --c7: #e66767; --c8: #55544f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #151514;
  --frame-1: #262625; --frame-2: #30302e;
  --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781;
  --line: #2c2c2a; --line-2: #383835; --hover: rgba(255,255,255,.05);
  --accent: #3987e5; --accent-soft: rgba(57,135,229,.16);
  --danger: #e66767; --danger-soft: rgba(230,103,103,.12);
  --grow: #ec835a; --shrink: #0ca30c; --ring: #ffffff;
  --c0: #3987e5; --c1: #d95926; --c2: #199e70; --c3: #c98500; --c4: #d55181;
  --c5: #008300; --c6: #9085e9; --c7: #e66767; --c8: #55544f;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 16px 40px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 13px/1.45 var(--font); -webkit-font-smoothing: antialiased;
  display: grid; grid-template-rows: auto auto 1fr; overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- header */
header {
  display: flex; align-items: center; gap: 16px; padding: 10px 16px;
  border-bottom: 1px solid var(--line); background: var(--surface);
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 15px; letter-spacing: -.01em; padding-right: 8px; }
.brand svg { display: block; }
#drives { display: flex; gap: 6px; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.drive {
  display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 10px; min-width: 168px;
  background: transparent; border: 1px solid var(--line); border-radius: var(--r); cursor: pointer; text-align: left;
  transition: background .15s, border-color .15s;
}
.drive:hover { background: var(--hover); }
.drive.on { border-color: var(--accent); background: var(--accent-soft); }
.drive:disabled { cursor: default; opacity: .55; }
.drive.on:disabled { opacity: 1; }
.dl { font-weight: 650; font-size: 15px; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dm { display: grid; gap: 3px; flex: 1; min-width: 0; }
.dn { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; gap: 8px; }
.dn b { font-weight: 500; color: var(--ink-3); }
.dbar { height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.dbar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.dbar i.hot { background: var(--danger); }
.hstatus { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
#status { color: var(--ink-3); font-size: 12px; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px;
  border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer;
  font-weight: 500; transition: background .12s, transform .08s, border-color .12s;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn svg { width: 15px; height: 15px; flex: none; }

/* ---------- toolbar */
.toolbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 48px;
  border-bottom: 1px solid var(--line); background: var(--surface-2);
}
#up { width: 32px; padding: 0; justify-content: center; }
#crumbs { display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
#crumbs button {
  border: 0; background: none; padding: 4px 7px; border-radius: 5px; cursor: pointer; color: var(--ink-2);
  max-width: 220px; overflow: hidden; text-overflow: ellipsis;
}
#crumbs button:hover { background: var(--hover); color: var(--ink); }
#crumbs button:last-child { color: var(--ink); font-weight: 600; }
#crumbs .sep { color: var(--ink-3); font-size: 11px; }
.vsum { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; }
.vsum .total { font-weight: 650; font-size: 15px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--hover); color: var(--ink-2); }
.chip.grow { color: var(--grow); background: color-mix(in srgb, var(--grow) 12%, transparent); }
.chip.shrink { color: var(--shrink); background: color-mix(in srgb, var(--shrink) 12%, transparent); }
.chip.note { color: var(--ink-2); }

/* ---------- main */
main { display: grid; grid-template-columns: minmax(0,1fr) 360px; min-height: 0; }
#map { position: relative; min-width: 0; min-height: 0; background: var(--surface); }
#map canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ov { cursor: default; }
#state {
  position: absolute; inset: 0; display: none; place-items: center; padding: 24px;
  grid-template-columns: minmax(0, 1fr);   /* long scan paths must not widen the column and re-center the card */
  background: color-mix(in srgb, var(--surface) 72%, transparent); backdrop-filter: blur(6px);
}
#state.show { display: grid; animation: fade .2s ease-out; }
@keyframes fade { from { opacity: 0 } }
.card {
  width: min(460px, 100%); min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 28px; box-shadow: var(--shadow);
}
.card .row-actions { display: flex; gap: 8px; }
.card h2 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.015em; font-weight: 650; }
.card p { margin: 0 0 18px; color: var(--ink-2); }
.card .big { font-size: 40px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; }
.card .of { color: var(--ink-3); font-size: 14px; margin-left: 4px; font-weight: 400; letter-spacing: 0; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 16px 0 12px; }
.progress i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .3s ease-out; }
.progress.indet i { width: 30% !important; animation: indet 1.2s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%) } to { transform: translateX(340%) } }
.scanmeta { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 12.5px; }
.ticker {
  margin: 14px 0 20px; font: 11.5px var(--mono); color: var(--ink-3); white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; direction: rtl; text-align: left;
}
.ticker span { direction: ltr; unicode-bidi: bidi-override; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg) } }
.loading { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }

/* ---------- side */
aside { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
#sel { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
.kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kind i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.sname { font-size: 17px; font-weight: 650; letter-spacing: -.01em; margin: 4px 0 2px; word-break: break-word; }
.spath { font: 11.5px/1.5 var(--mono); color: var(--ink-3); word-break: break-all; }
.ssize { display: flex; align-items: baseline; gap: 8px; margin: 12px 0 4px; flex-wrap: wrap; }
.ssize b { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
.ssize span { color: var(--ink-3); }
.smeta { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 14px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }

#comp { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.stack { display: flex; gap: 2px; height: 10px; margin-bottom: 10px; }
.stack i { display: block; height: 100%; border-radius: 2px; min-width: 2px; transition: opacity .15s; cursor: pointer; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
.legend button {
  display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 3px 6px; margin: 0 -6px;
  border-radius: 5px; cursor: pointer; text-align: left; font-size: 12px; color: var(--ink-2); min-width: 0;
}
.legend button:hover { background: var(--hover); }
.legend button.on { background: var(--accent-soft); color: var(--ink); }
.legend button.off { opacity: .45; }
.legend i { width: 9px; height: 9px; border-radius: 2px; flex: none; }
.legend span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend em { font-style: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.tabs { display: flex; gap: 2px; padding: 10px 12px 0; border-bottom: 1px solid var(--line); }
.tabs button {
  border: 0; background: none; padding: 8px 10px 10px; cursor: pointer; color: var(--ink-3); font-weight: 500;
  border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center;
}
.tabs button:hover { color: var(--ink); }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tabs .count { font-size: 11px; color: var(--grow); }
#list { flex: 1; overflow-y: auto; padding: 6px 8px 16px; min-height: 0; }
.row {
  display: grid; grid-template-columns: 10px minmax(0,1fr) auto; gap: 4px 10px; align-items: center;
  width: 100%; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; text-align: left;
}
.row:hover { background: var(--hover); }
.row.on { background: var(--accent-soft); }
.row.static { cursor: default; }
.row.static:hover { background: none; }
.row > i { width: 9px; height: 9px; border-radius: 2px; }
.row .rn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .rs { color: var(--ink-2); font-variant-numeric: tabular-nums; text-align: right; }
.row .rsub { grid-column: 2 / 4; display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--ink-3); min-width: 0; }
.row .rsub .rp { font-family: var(--mono); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; flex: 1; }
.row .rbar { flex: 1; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.row .rbar b { display: block; height: 100%; background: var(--line-2); }
.row .d { white-space: nowrap; }
.d.grow { color: var(--grow); }
.d.shrink { color: var(--shrink); }
.empty { padding: 28px 18px; color: var(--ink-3); text-align: center; }
.empty b { display: block; color: var(--ink-2); font-weight: 600; margin-bottom: 4px; }

/* ---------- floating */
#tip {
  position: fixed; z-index: 20; pointer-events: none; display: none; max-width: 360px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 11px;
  box-shadow: var(--shadow); font-size: 12.5px;
}
#tip .t1 { font-weight: 600; word-break: break-word; }
#tip .t2 { color: var(--ink-2); }
#tip .t3 { color: var(--ink-3); font-size: 11.5px; margin-top: 3px; }
#menu {
  position: fixed; z-index: 30; display: none; min-width: 210px; padding: 5px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 9px; box-shadow: var(--shadow);
  animation: pop .12s ease-out; transform-origin: top left;
}
@keyframes pop { from { opacity: 0; transform: scale(.97) } }
#menu button {
  display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 7px 10px;
  border-radius: 6px; cursor: pointer; text-align: left;
}
#menu button:hover, #menu button:focus-visible { background: var(--hover); outline: none; }
#menu button.danger { color: var(--danger); }
#menu button kbd { margin-left: auto; font: 11px var(--font); color: var(--ink-3); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
#menu svg { width: 15px; height: 15px; color: var(--ink-3); }
#menu .danger svg { color: var(--danger); }

dialog {
  border: 1px solid var(--line); border-radius: 14px; padding: 24px; width: min(440px, calc(100% - 32px));
  background: var(--surface); color: var(--ink); box-shadow: var(--shadow);
}
dialog::backdrop { background: rgba(0,0,0,.4); backdrop-filter: blur(2px); }
dialog[open] { animation: pop .15s ease-out; }
dialog h3 { margin: 0 0 8px; font-size: 17px; font-weight: 650; word-break: break-word; }
dialog p { margin: 0 0 10px; color: var(--ink-2); }
dialog .dpath { font: 11.5px var(--mono); color: var(--ink-3); word-break: break-all; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; margin-bottom: 12px; }
dialog .row-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }

#toasts { position: fixed; left: 16px; bottom: 16px; z-index: 40; display: grid; gap: 8px; }
.toast {
  display: flex; gap: 10px; align-items: flex-start; max-width: 420px; padding: 11px 14px; border-radius: 10px;
  background: var(--ink); color: var(--surface); box-shadow: var(--shadow); animation: up .2s ease-out;
}
.toast small { display: block; opacity: .75; }
.toast.error { background: var(--danger); color: #fff; }

/* ---------- scan chip (minimized scan) */
.scanchip {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); background: var(--accent-soft);
  cursor: pointer; font-weight: 500; animation: fade .2s ease-out;
}
.scanchip[hidden] { display: none; }
#map.busy #cv { filter: blur(3px); opacity: .7; transition: filter .2s, opacity .2s; }
#map.busy::after {
  content: ""; position: absolute; top: 14px; right: 14px; width: 18px; height: 18px; z-index: 2;
  border: 2px solid var(--line-2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
}
@media (max-width: 1100px) {
  .scanchip .minibar { display: none; }
  .drive { min-width: 0; }
  .dn b { display: none; }
  header { gap: 10px; }
}
.scanchip:hover { border-color: var(--accent); }
.scanchip .minibar { width: 56px; height: 4px; border-radius: 2px; background: var(--line-2); overflow: hidden; }
.scanchip .minibar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease-out; }
.spinner.sm { width: 14px; height: 14px; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.icon svg { width: 17px; height: 17px; }

/* ---------- compare picker */
.cmp { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-3); }
.cmp select {
  font: inherit; color: var(--ink-2); background: var(--hover); border: 1px solid transparent; border-radius: 999px;
  padding: 2px 8px; cursor: pointer; max-width: 210px;
}
.cmp select:hover { border-color: var(--line-2); }

/* ---------- settings */
dialog.wide { width: min(580px, calc(100% - 32px)); max-height: calc(100vh - 48px); overflow: auto; }
.set { padding: 16px 0; border-top: 1px solid var(--line); }
.set:first-of-type { border-top: 0; padding-top: 4px; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.set-row b { font-weight: 600; }
.set small { display: block; color: var(--ink-3); font-size: 12px; margin-top: 2px; max-width: 380px; }
.set select, .set input[type="time"] {
  font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-2);
  border-radius: 6px; height: 32px; padding: 0 8px;
}
.set-sub { display: grid; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 10px; background: var(--surface-2); transition: opacity .15s; }
.set-sub.off { opacity: .45; pointer-events: none; }
.field { display: flex; align-items: center; gap: 12px; color: var(--ink-2); }
.field > span:first-child { width: 48px; }
.checks { display: flex; flex-wrap: wrap; gap: 6px; }
.checks label {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-2);
  border-radius: 999px; cursor: pointer; font-size: 12.5px;
}
.checks label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.checks input { accent-color: var(--accent); margin: 0; }
.status-line { font-size: 12.5px; color: var(--ink-2); }
.status-line.ok::before { content: "✓ "; color: var(--shrink); font-weight: 700; }
.status-line.warn::before { content: "! "; color: var(--grow); font-weight: 700; }
.switch { position: relative; width: 40px; height: 22px; flex: none; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--line-2); transition: background .15s; pointer-events: none; }
.switch span::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
  background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s;
}
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line-2); }
.seg button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.report { display: grid; gap: 2px; margin-top: 10px; }
.report div { display: flex; gap: 10px; font-size: 12.5px; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--ink-2); }
.report div span:first-child { width: 118px; flex: none; color: var(--ink-3); }
.report div span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.form-error { color: var(--danger); font-size: 12.5px; margin-top: 10px; }
@keyframes up { from { opacity: 0; transform: translateY(8px) } }

/* ---------- view switcher */
.views { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--surface-2); border: 1px solid var(--line); flex: none; }
.views button {
  border: 0; background: none; padding: 6px 12px; border-radius: 7px; cursor: pointer; color: var(--ink-2); font-weight: 500;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.views button:hover { color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.views svg { width: 15px; height: 15px; }

/* ---------- staging tray button + drawer */
.stagebtn {
  display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 10px 0 9px; border-radius: 8px;
  border: 1px dashed var(--line-2); background: transparent; cursor: pointer; font-weight: 500; color: var(--ink-2);
  transition: background .15s, border-color .15s, transform .15s;
}
.stagebtn:hover { background: var(--hover); color: var(--ink); }
.stagebtn svg { width: 16px; height: 16px; }
.stagebtn b { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--line); color: var(--ink-2); font-size: 11px; display: inline-grid; place-items: center; }
.stagebtn.has { border-style: solid; border-color: color-mix(in srgb, var(--danger) 45%, transparent); color: var(--ink); }
.stagebtn.has b { background: var(--danger); color: #fff; }
.stagebtn.drop { border-color: var(--accent); background: var(--accent-soft); transform: scale(1.06); }
.stagebtn.bump { animation: bump .35s ease-out; }
@keyframes bump { 40% { transform: scale(1.12) } }
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); z-index: 35; background: var(--surface);
  border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
  transform: translateX(100%); transition: transform .22s cubic-bezier(.2,.8,.2,1); visibility: hidden;
}
#drawer.open { transform: none; visibility: visible; }
#drawer header { justify-content: space-between; background: none; }
#drawer h3 { margin: 0; font-size: 16px; }
#drawer .dbody { flex: 1; overflow: auto; padding: 8px 10px; }
#drawer .dfoot { padding: 14px 16px; border-top: 1px solid var(--line); display: grid; gap: 10px; }
#drawer .dfoot p { margin: 0; color: var(--ink-3); font-size: 12px; }
.sitem { display: grid; grid-template-columns: 10px minmax(0,1fr) auto 28px; gap: 2px 10px; align-items: center; padding: 8px 8px; border-radius: 6px; }
.sitem:hover { background: var(--hover); }
.sitem > i { width: 9px; height: 9px; border-radius: 2px; }
.sitem .sn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.sitem .sp { grid-column: 2 / 4; font: 11px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.sitem .sz { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sitem .err { grid-column: 2 / 4; color: var(--danger); font-size: 12px; }
.xbtn { border: 0; background: none; width: 26px; height: 26px; border-radius: 6px; cursor: pointer; color: var(--ink-3); grid-row: span 2; }
.xbtn:hover { background: var(--hover); color: var(--ink); }
#ghost {
  position: fixed; z-index: 50; pointer-events: none; padding: 6px 10px; border-radius: 8px; background: var(--ink); color: var(--surface);
  font-size: 12px; font-weight: 500; box-shadow: var(--shadow); display: none; white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis;
}

/* ---------- search */
.search { display: flex; align-items: center; gap: 6px; position: relative; }
.search input {
  width: 220px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface);
  color: var(--ink); font: inherit; padding: 0 28px 0 30px; transition: width .2s, border-color .15s;
}
.search input:focus { width: 300px; border-color: var(--accent); outline: none; }
.search > svg { position: absolute; left: 9px; width: 15px; height: 15px; color: var(--ink-3); pointer-events: none; }
.search .clear { position: absolute; right: 40px; }
#filtersBtn.on { border-color: var(--accent); color: var(--accent); }
.filters {
  position: absolute; top: 40px; right: 0; z-index: 25; width: 300px; padding: 14px; display: none; gap: 10px;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; box-shadow: var(--shadow);
}
.filters.open { display: grid; }
.filters label { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 8px; color: var(--ink-2); font-size: 12.5px; }
.filters select { font: inherit; height: 30px; border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface-2); color: var(--ink); padding: 0 6px; }

/* ---------- full-width panels (Clean up / Duplicates / Apps) */
#panel { min-height: 0; overflow: auto; background: var(--page); }
#panel[hidden] { display: none; }
.pwrap { max-width: 980px; margin: 0 auto; padding: 24px 24px 60px; }
.phead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
.phead h2 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.015em; }
.phead p { margin: 0; color: var(--ink-2); max-width: 560px; }
.ptotal { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
.ptotal small { display: block; font-size: 12px; font-weight: 400; color: var(--ink-3); letter-spacing: 0; text-align: right; }
.group-h { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; margin: 22px 0 8px; }
.ccard {
  display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 4px 16px; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 8px;
}
.ccard h4 { margin: 0; font-size: 14px; font-weight: 600; }
.ccard .cd { grid-column: 1; color: var(--ink-2); font-size: 12.5px; }
.ccard .cw { grid-column: 1 / -1; font: 11px var(--mono); color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ccard .cs { font-size: 17px; font-weight: 650; font-variant-numeric: tabular-nums; text-align: right; min-width: 90px; grid-row: 1 / 3; grid-column: 2; }
.ccard .ca { grid-row: 1 / 3; grid-column: 3; display: flex; gap: 6px; }
.ccard.done { opacity: .6; }
.ccard code { font: 12px var(--mono); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.badge { display: inline-block; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 1px 6px; border-radius: 4px; background: var(--hover); color: var(--ink-3); margin-left: 6px; vertical-align: 1px; }
.badge.warn { color: var(--grow); background: color-mix(in srgb, var(--grow) 12%, transparent); }
.cands { grid-column: 1 / -1; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 2px; }
.cand { display: grid; grid-template-columns: 22px minmax(0,1fr) auto; gap: 8px; align-items: center; padding: 4px 4px; border-radius: 6px; font-size: 12.5px; }
.cand:hover { background: var(--hover); }
.cand input { accent-color: var(--accent); margin: 0; }
.cand .cp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cand .cp small { color: var(--ink-3); margin-left: 6px; }
.cand .cz { font-variant-numeric: tabular-nums; color: var(--ink-2); }
.cand-actions { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.cand-actions span { color: var(--ink-3); font-size: 12px; }
.ptools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ptools select, .ptools input[type="search"] { font: inherit; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 0 10px; }
.dgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }
.dgroup .gh { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; }
.dgroup .gh b { font-weight: 600; }
.dgroup .gh span { color: var(--ink-3); font-size: 12px; }
.app { display: grid; grid-template-columns: 10px minmax(0,1fr) auto auto; gap: 2px 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 6px; }
.app > i { width: 9px; height: 9px; border-radius: 2px; background: var(--c2); }
.app .an { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .am { grid-column: 2; color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.app .as { grid-row: 1 / 3; grid-column: 3; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.app .as small { display: block; font-weight: 400; font-size: 11px; color: var(--ink-3); }
.app .aa { grid-row: 1 / 3; grid-column: 4; display: flex; gap: 6px; }
.app .cands { grid-column: 2 / -1; }

/* ---------- selection extras */
.trend { margin: 6px 0 12px; }
.trend svg { display: block; width: 100%; height: 46px; overflow: visible; }
.trend .tcap { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.hseg { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.hseg .h { margin: 0; }
.mini-seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: 7px; background: var(--surface-2); border: 1px solid var(--line); }
.mini-seg button { border: 0; background: none; padding: 2px 8px; border-radius: 5px; font-size: 11.5px; cursor: pointer; color: var(--ink-3); }
.mini-seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.tabs .spacer { flex: 1; }
.tabs .tbtn { border: 0; background: none; color: var(--ink-3); padding: 6px 8px; border-radius: 6px; cursor: pointer; margin-bottom: 6px; border-bottom: 0; }
.tabs .tbtn:hover { background: var(--hover); color: var(--ink); }
.preview-body { margin-top: 10px; max-height: calc(100vh - 220px); overflow: auto; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; min-height: 120px; }
.preview-body img, .preview-body video { max-width: 100%; max-height: calc(100vh - 240px); display: block; }
.preview-body pre { margin: 0; padding: 14px; font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-word; width: 100%; align-self: start; }
.preview-body iframe { width: 100%; height: calc(100vh - 260px); border: 0; }
dialog.xl { width: min(900px, calc(100% - 32px)); }

main[hidden], .toolbar[hidden], .tabs button[hidden] { display: none; }
body.no-toolbar { grid-template-rows: auto 1fr; }
.tnote { font-size: 12px; color: var(--ink-3); padding: 6px 10px 8px; }
@media (max-width: 1250px) { .views button span { display: none; } .search input { width: 160px; } .search input:focus { width: 220px; } }
@media (max-width: 1000px) {
  .dm, #stageLabel, .vsum .chip.note, .vsum .chip.grow, .vsum .chip.shrink { display: none; }
  .drive { padding: 6px 10px; }
  .hstatus { gap: 8px; }
}
@media (max-width: 900px) {
  body { overflow: auto; }
  main { grid-template-columns: 1fr; }
  #map { height: 62vh; }
  aside { border-left: 0; border-top: 1px solid var(--line); }
  .hstatus #status { display: none; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<body>
<header>
  <div class="brand" aria-label="Hoard">

    Hoard

    <button data-view="cleanup" aria-pressed="false" title="Clean up (2)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2 6 8.5M3.5 8.5h7l-1 6h-5z M5.5 11.5v3M8.5 11.5v3"/></svg><span>Clean up</span></button>

const ICON = {

  copy: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1.5"/><path d="M11 5V3.5A1.5 1.5 0 0 0 9.5 2h-6A1.5 1.5 0 0 0 2 3.5v6A1.5 1.5 0 0 0 3.5 11H5"/></svg>',
  trash: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4"/></svg>',
  up: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',

/* growth over time: the folder's size in each saved scan */
let trendToken = 0;
async function renderTrend(path) {
  const my = ++trendToken;
  let r;
  try { r = await api("trend", { drive: S.drive, path }); } catch { return; }
  const el = $("#trend");
  if (my !== trendToken || !el) return;
  const pts = r.points.filter(p => p.s !== null && p.s !== undefined);
  if (pts.length < 2) { el.remove(); return; }
  const Wt = el.clientWidth || 320, Ht = 46, pad = 4;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts;
  let lo = Math.min(...pts.map(p => p.s)), hi = Math.max(...pts.map(p => p.s));
  if (hi - lo < hi * .02) { lo = hi * .97; hi = hi * 1.01 + 1; }
  const X = t => pad + (t1 === t0 ? 0 : (t - t0) / (t1 - t0)) * (Wt - pad * 2);
  const Y = s => Ht - pad - (s - lo) / (hi - lo) * (Ht - pad * 2);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.ts).toFixed(1)},${Y(p.s).toFixed(1)}`).join("");
  const area = `${line}L${X(t1).toFixed(1)},${Ht}L${X(t0).toFixed(1)},${Ht}Z`;
  const first = pts[0].s, last = pts[pts.length - 1].s, d = last - first;
  el.innerHTML = `<svg viewBox="0 0 ${Wt} ${Ht}" role="img" aria-label="Size over the last ${pts.length} scans">
      <path d="${area}" fill="var(--accent)" opacity=".1"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
      ${pts.map(p => `<circle cx="${X(p.ts).toFixed(1)}" cy="${Y(p.s).toFixed(1)}" r="${pts.length > 40 ? 0 : 3}" fill="var(--surface)" stroke="var(--accent)" stroke-width="1.5"><title>${esc(when(p.ts))}: ${fmt(p.s)}</title></circle>`).join("")}
    </svg>
    <div class="tcap"><span>${pts.length} scans since ${esc(when(t0))}</span><span class="${d > MB ? "d grow" : d < -MB ? "d shrink" : ""}">${Math.abs(d) < MB ? "steady" : (d > 0 ? "▲ " : "▼ ") + fmt(Math.abs(d))}</span></div>`;
}

/* ------------------------------------------------------------------ side lists */

function rowHTML(item, i, max, opts = {}) {

async function renderList() {

  if (tab === "contents") {
    items = S.view.ch || [];

  } else {
    const cacheKey = tab + "|" + key;
    if (!S.lists[cacheKey]) {
      el.innerHTML = `<div class="empty"><div class="loading" style="justify-content:center"><div class="spinner"></div>Looking…</div></div>`;
      try { S.lists[cacheKey] = await api(tab, { drive: S.drive, path: S.path }); }
      catch (e) { el.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
      if (S.tab !== tab || key !== S.drive + "|" + S.path.join("\\")) return;
    }
    const res = S.lists[cacheKey];
    items = res.items;
    opts = { where: true, growth: tab === "changes" };
    if (tab === "changes" && res.noPrev) {

    }

/* ------------------------------------------------------------------ actions */
async function act(what, path, n) {
  closeMenu();
  if (what === "zoom") return zoomInto(path, S.rects.find(r => r.path && same(r.path, path)));
  if (what === "copy") {
    const ok = await copyText(fullPath(path));
    toast(ok ? "Path copied" : "Couldn't copy the path.", ok ? "ok" : "error");
    return;
  }
  if (what === "reveal") {
    try { const r = await api("reveal", { drive: S.drive, path }); if (r.error) toast(r.error, "error"); } catch (e) { toast(e.message, "error"); }
    return;
  }
  if (what === "recycle") return confirmRecycle(path, n);
  if (what === "stage") return stage([stageItem(path, n)]);
  if (what === "preview") return preview(path, n);
  if (what === "launch") {
    try { const r = await api("open", { drive: S.drive, path }); if (r.error) toast(r.error, "error"); } catch (e) { toast(e.message, "error"); }
    return;
  }
  if (what === "ignore" || what === "unignore") {
    try {
      const r = await api("ignore", { drive: S.drive, path, on: what === "ignore" });
      S.ignore = r.ignore;
      toast(what === "ignore" ? `“${n.n}” is now hidden from the map and lists` : `“${n.n}” is back on the map`, "ok",
            what === "ignore" ? "Undo it in Settings, or right-click its parent." : "");
      S.sel = null; await loadView(S.path, { force: true });
    } catch (e) { toast(e.message, "error"); }
    return;
  }
  if (what === "watch") return askWatch(path, n);
}

    ${!$("#dlg") ? "" : `<p style="margin-top:12px;font-size:12px;color:var(--ink-3)">Alerts need the daily scan turned on in Settings.</p>`}
    <div class="row-actions">${w ? `<button class="btn" id="wOff">Remove alert</button>` : ""}<button class="btn" id="wCancel">Cancel</button><button class="btn primary" id="wOk">Set alert</button></div>`;
  const save = async gb => {

  menu.querySelectorAll("button").forEach(b => b.onclick = () => b.dataset.act === "up" ? (closeMenu(), goUp()) : act(b.dataset.act, path, n));
  menu.style.display = "block";
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  menu.style.left = Math.min(x, innerWidth - mw - 8) + "px";
  menu.style.top = Math.min(y, innerHeight - mh - 8) + "px";
  tip.style.display = "none";
  menu.querySelector("button")?.focus();
}
function closeMenu() { menu.style.display = "none"; }
addEventListener("mousedown", e => { if (!menu.contains(e.target)) closeMenu(); });
addEventListener("blur", closeMenu);

/* keyboard */
addEventListener("keydown", e => {
  if ($("#dlg").open) return;
  const typing = e.target.matches?.("input, select, textarea");
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "f") { e.preventDefault(); if (S.mode !== "map") setMode("map"); $("#q").focus(); $("#q").select(); return; }
  if (typing) return;
  if (e.key === "Escape") {
    if ($("#drawer").classList.contains("open")) return toggleDrawer(false);
    if ($("#filters").classList.contains("open")) return toggleFilters(false);
    if (menu.style.display === "block") closeMenu(); else if (S.focusCat !== null) { S.focusCat = null; draw(); drawOverlay(); renderComp(); } else setSel(null); return;
  }
  if (!e.ctrlKey && !e.metaKey && !e.altKey && "1234".includes(e.key) && e.key.length === 1) { setMode(["map", "cleanup", "dupes", "apps"][+e.key - 1]); return; }
  if (S.mode !== "map") return;
  if (e.key === "/") { e.preventDefault(); $("#q").focus(); return; }
  if (e.key.toLowerCase() === "s" && !e.ctrlKey && !e.metaKey && S.sel && canDelete(S.sel.path)) { e.preventDefault(); act("stage", S.sel.path, S.sel.node); return; }
  if (e.key === " " && S.sel?.node.k === "f") { e.preventDefault(); act("preview", S.sel.path, S.sel.node); return; }
  if (menu.style.display === "block") {
    const items = [...menu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    return;
  }
  const del = e.key === "Delete" || (e.metaKey && e.key === "Backspace");
  if (del) { if (S.sel && canDelete(S.sel.path)) { e.preventDefault(); confirmRecycle(S.sel.path, S.sel.node); } }
  else if (e.key === "Backspace" || (e.altKey && e.key === "ArrowLeft") || (e.metaKey && e.key === "ArrowUp")) { e.preventDefault(); goUp(); }
  else if (e.key === "Enter" && S.sel?.node.k === "d" && (e.target === document.body || e.target === ov)) act("zoom", S.sel.path, S.sel.node);
});
$("#up").onclick = goUp;

/* toasts */
function toast(msg, kind = "ok", sub = "", action = null) {
  const t = document.createElement("div");
  t.className = "toast" + (kind === "error" ? " error" : "");
  t.innerHTML = `<div>${esc(msg)}${sub ? `<small>${esc(sub)}</small>` : ""}</div>`;
  if (action) {
    const b = document.createElement("button");
    b.className = "btn"; b.style.cssText = "height:28px;margin-left:6px;flex:none;color:var(--ink);background:var(--surface)";
    b.textContent = action.label; b.onclick = () => { t.remove(); action.run(); };
    t.appendChild(b);
  }
  $("#toasts").appendChild(t);
  setTimeout(() => { t.style.transition = "opacity .3s"; t.style.opacity = 0; setTimeout(() => t.remove(), 300); }, action ? 9000 : kind === "error" ? 7000 : 4200);
}

/* ------------------------------------------------------------------ overlay states */
const stateEl = $("#state");
function showState(kind, data) {
  stateEl.classList.add("show");
  const d = S.drives.find(x => x.id === S.drive), vn = esc(vol().name);

  } else if (kind === "empty") {

      <p>Hoard reads every folder on the drive and draws it as a map, so the biggest things are the biggest blocks.

      ${S.os === "macos" && vol().root === "/" ? `<p>Tip: give Hoard <b>Full Disk Access</b> in System Settings → Privacy &amp; Security, or many folders will show as unreadable.</p>` : ""}
      ${S.os === "linux" && vol().root === "/" ? `<p>Folders your account can't read (other users' files, some system folders) are skipped and counted as unreadable.</p>` : ""}

      <div class="progress" id="scBar"><i></i></div>
      <div class="scanmeta num"><span id="scFiles">Starting…</span><span id="scTime"></span></div>
      <div class="ticker" id="scCur"><span></span></div>
      <div class="row-actions">
        ${S.view ? `<button class="btn primary" id="scHide" title="Keep scanning in the background and use the map">Hide</button>` : ""}
        <button class="btn" id="scCancel">Cancel scan</button>
      </div></div>`;
    $("#scCancel").onclick = async () => { $("#scCancel").disabled = true; await api("cancel"); };

}
$("#scanChip").onclick = () => { S.scanMin = false; showState("scan"); updateScanUI(S.lastProg); };

/* progress shows in the modal, or in the header chip once the modal is hidden */
function updateScanUI(p) {
  const chip = $("#scanChip");
  chip.hidden = !(S.scanning && S.scanMin);
  if (!p || !S.scanning) return;
  const pct = p.used ? Math.min(99, p.bytes / p.used * 100) : 0;
  if (S.scanMin) {
    $("#scanChipText").textContent = `Scanning ${vol().name} · ${Math.round(pct)}%`;
    $("#scanChipBar").style.width = pct + "%";
    return;
  }
  if (!$("#scBar")) return;
  targetBytes = p.bytes; if (!rafId) rafId = requestAnimationFrame(animateBytes);
  $("#scOf").textContent = p.used ? ` of ~${fmt(p.used)}` : "";
  $("#scBar i").style.width = pct + "%";
  $("#scFiles").textContent = p.cancelled ? "Stopping…" : `${p.files.toLocaleString()} files`;
  const s = Math.round(p.elapsed); $("#scTime").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("#scCur span").textContent = p.current || "";
}
function hideState() { stateEl.classList.remove("show"); stateEl.innerHTML = ""; }
function showStateMessage(title, text) {
  stateEl.classList.add("show");
  stateEl.innerHTML = `<div class="card"><h2>${esc(title)}</h2><p>${esc(text)}</p></div>`;
}

/* ------------------------------------------------------------------ scanning */
let shownBytes = 0, targetBytes = 0, rafId = 0;
function animateBytes() {
  shownBytes += (targetBytes - shownBytes) * .18;
  if (Math.abs(targetBytes - shownBytes) < MB) shownBytes = targetBytes;
  const el = $("#scBytes"); if (el) el.textContent = fmt(shownBytes);
  rafId = shownBytes !== targetBytes ? requestAnimationFrame(animateBytes) : 0;
}
async function startScan() {
  if (!S.drive || S.scanning) return;
  try {
    const r = await api("scan", { drive: S.drive });
    if (r.error) return toast(r.error, "error");
  } catch (e) { return toast(e.message, "error"); }
  S.scanning = true; S.scanMin = false; S.lastProg = null; shownBytes = targetBytes = 0;
  closeMenu(); tip.style.display = "none";
  showState("scan"); renderAll();
  poll();
}
async function poll() {
  let p;
  try { p = await api("progress"); } catch (e) { toast(e.message, "error"); return; }
  if (p.running) {
    S.lastProg = p;
    updateScanUI(p);
    setTimeout(poll, 250);
    return;
  }
  S.scanning = false; S.scanMin = false; S.lastProg = null;
  updateScanUI(null);
  if (p.error) { toast("The scan failed: " + p.error, "error"); }
  else if (p.cancelled) { toast("Scan cancelled. Nothing was saved."); }
  else {
    toast(`Scanned ${vol().name} in ${Math.round(p.elapsed)} s`, "ok", `${p.files.toLocaleString()} files, ${fmt(p.bytes)}${p.errors ? ` · ${p.errors.toLocaleString()} items couldn't be read` : ""}`);
    S.meta = await api("open_drive", { drive: S.drive });
    refreshDrives();
    if (S.meta.prevTime) { S.tab = "changes"; document.querySelectorAll(".tabs button").forEach(x => x.setAttribute("aria-selected", x.dataset.tab === "changes")); }
    await loadHistory();
    await loadView([]);
    return;
  }
  if (S.view) hideState(); else showState("empty");
  renderAll();
}

/* ------------------------------------------------------------------ shared helpers */
const SPIN = '<div class="spinner sm"></div>';
const volOf = id => S.drives.find(d => d.id === id);
function absPath(vid, p) {
  const v = volOf(vid), sep = S.sep;
  if (!v) return p.join(sep);
  return p.length ? (v.root.endsWith(sep) ? v.root : v.root + sep) + p.join(sep) : v.root;
}
function confirmDialog(title, bodyHTML, okLabel, danger) {
  return new Promise(res => {
    const d = $("#dlg"); d.className = "";
    d.innerHTML = `<h3>${esc(title)}</h3>${bodyHTML}<div class="row-actions"><button class="btn" id="cdNo" autofocus>Cancel</button>

    $("#cdYes").onclick = () => { v = true; d.close(); };

}
function popMenu(x, y, entries) {

/* ------------------------------------------------------------------ views */
function setMode(m) {
  if (!m || S.mode === m) return;

  document.querySelectorAll(".views button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === m));
  const isMap = m === "map";
  $("main").hidden = !isMap;
  $("#panel").hidden = isMap;

  document.body.classList.toggle("no-toolbar", !isMap);

  if (m === "cleanup") renderCleanup();
  if (m === "dupes") renderDupes();

}
document.querySelectorAll(".views button").forEach(b => b.onclick = () => setMode(b.dataset.view));

/* ------------------------------------------------------------------ staging area */
async function loadStaged() {
  try { S.staged = await api("stage_list"); } catch { /* keep what we have */ }
  renderStageBtn();
  if ($("#drawer").classList.contains("open")) renderDrawer();
}
function renderStageBtn() {
  const n = S.staged.items.length;
  $("#stageBtn").classList.toggle("has", n > 0);
  $("#stageCount").textContent = n;
  $("#stageLabel").textContent = n ? fmt(S.staged.total) : "Staged";
}
function bump() { const b = $("#stageBtn"); b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
async function stage(items, absItems) {
  try {
    const r = absItems ? await api("stage_add", { abs: absItems }) : await api("stage_add", { drive: S.drive, items });
    S.staged = r; renderStageBtn(); bump();
    const list = absItems || items;
    if (!r.added) toast("Already in the staging area");
    else toast(`Staged ${r.added === 1 ? `“${list[0].name}”` : `${r.added} items`}`, "ok", `${fmt(r.total)} waiting in the staging area. Nothing is removed until you confirm there.`,
               { label: "Review", run: () => toggleDrawer(true) });

  } catch (e) { toast(e.message, "error"); }
}
function toggleDrawer(open) {
  const d = $("#drawer");

  d.setAttribute("aria-hidden", String(!open));
  if (open) renderDrawer();
}
$("#stageBtn").onclick = () => toggleDrawer();
$("#drawerClose").onclick = () => toggleDrawer(false);
function renderDrawer() {
  const items = S.staged.items, body = $("#drawerBody"), foot = $("#drawerFoot");
  if (!items.length) {
    body.innerHTML = `<div class="empty"><b>Nothing staged yet</b>Drag blocks from the map onto the Staged button, press <b style="display:inline">S</b> on a selection, or add suggestions from Clean up, Duplicates and Apps. Nothing is removed until you confirm here.</div>`;
    foot.innerHTML = ""; return;
  }
  body.innerHTML = items.map((it, i) => `<div class="sitem"><i style="background:var(--c${it.c})"></i>
      <span class="sn" title="${esc(it.name)}">${esc(it.name)}</span><span class="sz">${fmt(it.size)}</span>
      <button class="xbtn" data-i="${i}" title="Take it out of the staging area" aria-label="Remove from staging">✕</button>
      <span class="sp" title="${esc(absPath(it.vol, it.path))}"><span>${esc(absPath(it.vol, it.path))}</span></span>
      ${it.error ? `<span class="err">${esc(it.error)}</span>` : ""}</div>`).join("");
  body.querySelectorAll(".xbtn").forEach(b => b.onclick = async () => {
    const it = items[+b.dataset.i];
    S.staged = await api("stage_remove", { vol: it.vol, path: it.path }); renderStageBtn(); renderDrawer();
  });
  foot.innerHTML = `<div class="set-row"><b>${items.length} item${items.length > 1 ? "s" : ""}</b><b class="num">${fmt(S.staged.total)}</b></div>
    <p>Everything goes to the ${S.trashName}, so you can still restore it. Empty the ${S.trashName} afterwards to free the space.</p>
    <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="stClear">Clear list</button>
      <button class="btn danger solid" id="stTrash">${ICON.trash}Move all to ${S.trashName}</button></div>`;
  $("#stClear").onclick = async () => { S.staged = await api("stage_clear"); renderStageBtn(); renderDrawer(); };
  $("#stTrash").onclick = async e => {
    if (S.scanning) return toast("Wait for the scan to finish first.", "error");
    const b = e.currentTarget; b.disabled = true; b.innerHTML = SPIN + "Moving…";
    try {
      const r = await api("stage_trash");
      S.staged = { items: r.items, total: r.total }; renderStageBtn(); renderDrawer();
      if (r.done) toast(`Moved ${r.done} item${r.done > 1 ? "s" : ""} (${fmt(r.size)}) to the ${S.trashName}`, "ok",
        r.failed.length ? `${r.failed.length} couldn't be moved and are still listed.` : `Empty the ${S.trashName} to free the space.`,
        { label: `Empty ${S.trashName}`, run: emptyBin });
      else if (r.failed.length) toast(`Nothing was moved: ${r.failed[0].error}`, "error");
      refreshDrives();
      if (S.view) loadView(S.path, { force: true });
    } catch (err) { toast(err.message, "error"); b.disabled = false; }
  };
}
async function emptyBin() {
  const ok = await confirmDialog(`Empty the ${S.trashName}?`, `<p>Everything in the ${S.trashName} is deleted for good. This can't be undone.</p>`, `Empty ${S.trashName}`, true);
  if (!ok) return;
  try {
    const r = await api("cleanup_run", { id: "bin" });
    if (r.error) toast(r.error, "error"); else toast(`Emptied the ${S.trashName}`, "ok", r.freed ? `Freed ${fmt(r.freed)}.` : "");
    refreshDrives();
    if (S.mode === "cleanup") pollCleanup();
  } catch (e) { toast(e.message, "error"); }
}

/* drag blocks from the map (or rows from the lists) onto the Staged button */
let dragItems = null, dragStart = null;
const ghost = $("#ghost"), stageBtn = $("#stageBtn");
ov.addEventListener("mousedown", e => {
  if (e.button !== 0) return;
  const r = hit(e);
  if (r && r.path && canDelete(r.path)) dragStart = { x: e.clientX, y: e.clientY, r };
});
addEventListener("mousemove", e => {
  if (!dragStart || e.buttons !== 1) { if (dragStart && !dragItems) dragStart = null; return; }
  if (!dragItems && Math.hypot(e.clientX - dragStart.x, e.clientY - dragStart.y) > 8) {
    dragItems = [stageItem(dragStart.r.path, dragStart.r.n)];
    ghost.textContent = `${dragStart.r.n.n} · ${fmt(dragStart.r.n.s)}`;
    ghost.style.display = "block"; tip.style.display = "none";
  }
  if (dragItems && dragStart) {
    ghost.style.left = e.clientX + 14 + "px"; ghost.style.top = e.clientY + 14 + "px";
    const over = stageBtn.contains(document.elementFromPoint(e.clientX, e.clientY));
    stageBtn.classList.toggle("drop", over);
  }
});
addEventListener("mouseup", e => {
  if (dragItems && dragStart) {
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (stageBtn.contains(target) || $("#drawer").contains(target)) stage(dragItems);
  }
  if (dragStart && dragItems) ghost.style.display = "none";
  stageBtn.classList.remove("drop");
  if (dragStart) { dragItems = null; dragStart = null; }
});
stageBtn.addEventListener("dragover", e => { if (dragItems) { e.preventDefault(); stageBtn.classList.add("drop"); } });
stageBtn.addEventListener("dragleave", () => stageBtn.classList.remove("drop"));
stageBtn.addEventListener("drop", e => { e.preventDefault(); stageBtn.classList.remove("drop"); if (dragItems) stage(dragItems); dragItems = null; });
addEventListener("dragend", () => { if (!dragStart) dragItems = null; stageBtn.classList.remove("drop"); });

/* ------------------------------------------------------------------ search & filters */
$("#fCat").innerHTML = `<option value="">Any type</option>` + CATN.map((n, i) => `<option value="${i}">${n}</option>`).join("");
function toggleFilters(open) {
  const f = $("#filters");
  open = open ?? !f.classList.contains("open");
  f.classList.toggle("open", open);
  $("#filtersBtn").setAttribute("aria-expanded", String(open));
}
$("#filtersBtn").onclick = e => { e.stopPropagation(); toggleFilters(); };
addEventListener("mousedown", e => { if (!$("#searchBox").contains(e.target)) toggleFilters(false); });
function searchParams() {
  return { q: $("#q").value.trim(), kind: $("#fKind").value, minSize: +$("#fSize").value, cat: $("#fCat").value,
           olderDays: $("#fAge").value, ext: $("#fExt").value.trim() };
}
const filtersActive = p => p.kind !== "any" || p.minSize > 0 || p.cat !== "" || p.olderDays !== "" || p.ext !== "";
let searchT = 0, searchTok = 0;
function runSearch() {
  clearTimeout(searchT);
  searchT = setTimeout(async () => {
    const p = searchParams(), tabBtn = document.querySelector('[data-tab="search"]');
    $("#filtersBtn").classList.toggle("on", filtersActive(p));
    if (!p.q && !filtersActive(p)) {
      tabBtn.hidden = true; S.searchRes = null;
      if (S.tab === "search") selectTab("contents");
      return;
    }
    if (!S.view) return;
    tabBtn.hidden = false;
    const my = ++searchTok;
    S.searchRes = { loading: true };
    if (S.tab !== "search") selectTab("search"); else renderList();
    let r;
    try { r = await api("search", { drive: S.drive, path: S.path, ...p }); } catch (e) { r = { error: e.message }; }
    if (my !== searchTok) return;
    S.searchRes = r;
    if (S.tab === "search") renderList();
  }, 220);
}
$("#q").addEventListener("input", runSearch);
$("#q").addEventListener("keydown", e => { if (e.key === "Escape") { $("#q").value = ""; runSearch(); $("#q").blur(); } });
["fKind", "fSize", "fCat", "fAge"].forEach(id => $("#" + id).onchange = runSearch);
$("#fExt").addEventListener("input", runSearch);
$("#fReset").onclick = () => { $("#fKind").value = "any"; $("#fSize").value = "0"; $("#fCat").value = ""; $("#fAge").value = ""; $("#fExt").value = ""; runSearch(); };
function renderSearchResults(el) {
  const r = S.searchRes;
  if (!r || r.loading) { el.innerHTML = `<div class="empty"><div class="loading" style="justify-content:center">${SPIN}Searching…</div></div>`; return; }
  if (r.error) { el.innerHTML = `<div class="empty">${esc(r.error)}</div>`; return; }
  if (!r.items.length) { el.innerHTML = `<div class="empty"><b>No matches</b>Nothing in ${esc(S.view.n)} matches. Search covers folders and files of 1 MB or more.</div>`; return; }
  const max = r.items[0].s || 1;
  el.innerHTML = `<div class="tnote">${r.count.toLocaleString()} match${r.count > 1 ? "es" : ""}${r.count > 300 ? " · the 300 largest" : ""}${r.total ? ` · ${fmt(r.total)} in total` : ""}</div>`
    + r.items.map((it, i) => rowHTML(it, i, max, { where: true })).join("");
  el.querySelectorAll(".row").forEach(row => {
    const it = r.items[+row.dataset.i];
    row.onclick = () => jumpTo(it);
    row.oncontextmenu = e => { e.preventDefault(); openMenu(e.clientX, e.clientY, it.p, { n: it.p[it.p.length - 1], s: it.s, k: it.k, c: it.c, a: it.a }); };
    row.draggable = true;
    row.ondragstart = e => { dragItems = [stageItem(it.p, { n: it.p[it.p.length - 1], s: it.s, k: it.k, c: it.c })]; e.dataTransfer.setData("text/plain", fullPath(it.p)); };
  });

/* ------------------------------------------------------------------ file types */

  }

  const max = r.items[0].s || 1;
  el.innerHTML = `<div class="tnote">By extension, counting files of 1 MB or more (${fmt(r.tracked)} of ${fmt(r.total)}). Click one to list its files.</div>`

const PV = { img: "jpg jpeg png gif webp bmp svg ico avif", video: "mp4 webm m4v mov ogv", audio: "mp3 wav ogg m4a flac aac opus",
  text: "txt log md json csv tsv xml yml yaml ini cfg conf toml py js mjs ts tsx jsx css scss html htm bat cmd ps1 sh lua sql gitignore env lock properties gradle rs go java c h cpp cs rb php" };
Object.keys(PV).forEach(k => PV[k] = new Set(PV[k].split(" ")));
function fileURL(vid, path) { return `/file?t=${encodeURIComponent(TOKEN)}&v=${encodeURIComponent(vid)}&p=${encodeURIComponent(JSON.stringify(path))}`; }
async function preview(path, n, vid = S.drive) {
  const d = $("#dlg"); d.className = "xl";
  const name = n.n || path[path.length - 1], ext = (name.includes(".") ? name.split(".").pop() : "").toLowerCase();
  const url = fileURL(vid, path);
  let body = `<div class="loading">${SPIN}Loading…</div>`;
  if (PV.img.has(ext)) body = `<img src="${url}" alt="${esc(name)}">`;
  else if (PV.video.has(ext)) body = `<video src="${url}" controls preload="metadata"></video>`;
  else if (PV.audio.has(ext)) body = `<audio src="${url}" controls preload="metadata" style="width:90%;margin:30px"></audio>`;
  const textLike = PV.text.has(ext) || (!ext && n.s < (1 << 20));
  d.innerHTML = `<h3>${esc(name)}</h3><div class="dpath">${esc(absPath(vid, path))}</div>
    <div class="smeta" style="margin:0"><span class="chip num">${fmt(n.s)}</span>${n.a ? `<span class="chip">Modified ${dateStr(n.a)}</span>` : ""}</div>
    <div class="preview-body" id="pvBody">${PV.img.has(ext) || PV.video.has(ext) || PV.audio.has(ext) ? body : textLike ? body
      : `<div class="empty"><b>No preview for .${esc(ext || "this file")}</b>Open it with its usual app instead.</div>`}</div>
    <div class="row-actions"><button class="btn" id="pvLaunch">${ICON.launch}Open with default app</button>
      <button class="btn" id="pvReveal">${ICON.open}Show in ${S.revealName}</button>
      ${canDelete(path) ? `<button class="btn" id="pvStage">${ICON.stage}Stage</button>` : ""}
      <button class="btn primary" id="pvClose" autofocus>Close</button></div>`;
  $("#pvClose").onclick = () => d.close();
  $("#pvLaunch").onclick = async () => { const r = await api("open", { drive: vid, path }); if (r.error) toast(r.error, "error"); };
  $("#pvReveal").onclick = () => api("reveal", { drive: vid, path });
  const st = $("#pvStage");
  if (st) st.onclick = () => { d.close(); vid === S.drive ? stage([stageItem(path, n)]) : stage(null, [{ path: absPath(vid, path), name, size: n.s, kind: "f", c: n.c }]); };
  d.onclose = () => { d.onclose = null; d.querySelectorAll("video,audio").forEach(m => m.pause()); d.className = ""; };
  d.showModal();
  if (textLike) {
    try {
      const res = await fetch(url, { headers: { Range: "bytes=0-65535" } });
      const buf = new Uint8Array(await res.arrayBuffer());
      const pv = $("#pvBody"); if (!pv) return;
      if (buf.includes(0)) { pv.innerHTML = `<div class="empty"><b>This looks like a binary file</b>Open it with its usual app instead.</div>`; return; }
      const text = new TextDecoder("utf-8", { fatal: false }).decode(buf);
      pv.innerHTML = `<pre></pre>`; pv.firstChild.textContent = text + (n.s > 65536 ? "\n\n… (showing the first 64 KB)" : "");
    } catch (e) { const pv = $("#pvBody"); if (pv) pv.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }
}

/* ------------------------------------------------------------------ Clean up */
S.cleanup = null; S.cleanOpen = new Set(); S.cleanSel = {};

function cleanCard(i) {
  const pending = i.pending || i.size === null || i.size === undefined;
  const size = pending ? SPIN : i.size ? fmt(i.size) : `<span style="color:var(--ink-3);font-weight:400;font-size:13px">${i.action === "command" || i.action === "tool" ? "—" : "Nothing to clean"}</span>`;
  let actions = "";
  const empty = !pending && !i.size;
  if (i.action === "empty_bin") actions = `<button class="btn danger" data-run="${i.id}" ${empty ? "disabled" : ""}>Empty</button>`;
  else if (i.action === "clear") actions = `<button class="btn" data-run="${i.id}" ${empty || pending ? "disabled" : ""}>Clean</button>`;
  else if (i.action === "tool") actions = `<button class="btn" data-run="${i.id}">Open Disk Cleanup</button>`;
  else if (i.action === "command") actions = `<button class="btn" data-copy="${esc(i.command)}" ${i.admin ? 'data-admin="1"' : ""}>${ICON.copy}Copy command</button>`;
  else if (i.candidates) actions = `<button class="btn" data-toggle="${i.id}" ${!i.candidates.length ? "disabled" : ""}>${S.cleanOpen.has(i.id) ? "Hide" : `Review ${i.candidates.length}`}</button>`;
  const badges = (i.review ? `<span class="badge warn">Check first</span>` : "") + (i.admin ? `<span class="badge">Needs admin</span>` : "")
    + (i.needsRescan ? `<span class="badge">Rescan for full results</span>` : "") + (i.done ? `<span class="badge">Done</span>` : "");
  let cands = "";
  if (i.candidates && S.cleanOpen.has(i.id)) {
    const set = S.cleanSel[i.id] || new Set();
    const selSize = i.candidates.reduce((a, c, k) => a + (set.has(k) ? c.size : 0), 0);
    cands = `<div class="cands">${i.candidates.slice(0, 200).map((c, k) => `<label class="cand"><input type="checkbox" data-cand="${i.id}|${k}" ${set.has(k) ? "checked" : ""}>
        <span class="cp" title="${esc(c.path)}">${esc(c.name)}${c.age ? `<small>last changed ${dateStr(c.age)}</small>` : ""}</span><span class="cz">${fmt(c.size)}</span></label>`).join("")}
      <div class="cand-actions"><button class="btn" data-all="${i.id}">${set.size === i.candidates.length ? "Select none" : "Select all"}</button>
        <button class="btn primary" data-stagesel="${i.id}" ${set.size ? "" : "disabled"}>${ICON.stage}Stage ${set.size ? `${set.size} (${fmt(selSize)})` : "selected"}</button>
        <span>Staged items go to the ${S.trashName} only when you confirm in the staging area.</span></div></div>`;
  }
  return `<div class="ccard ${i.done ? "done" : ""}"><h4>${esc(i.title)}${badges}</h4><div class="cs">${size}</div><div class="ca">${actions}</div>
    <div class="cd">${esc(i.desc)}${i.action === "command" ? `<div style="margin-top:6px"><code>${esc(i.command)}</code></div>` : ""}${i.error ? `<div style="color:var(--danger)">${esc(i.error)}</div>` : ""}</div>
    ${i.where?.length ? `<div class="cw" title="${esc(i.where.join("\n"))}">${esc(i.where.join("  ·  "))}</div>` : ""}${cands}</div>`;
}
async function runCleanup(i) {
  if (!i) return;
  if (i.action === "empty_bin") return emptyBin();
  if (i.action === "clear") {
    const ok = await confirmDialog(`Clean ${i.title.toLowerCase()}?`,
      `<p>Permanently deletes about <b>${fmt(i.size)}</b>${i.files ? ` (${i.files.toLocaleString()} files)` : ""}. ${esc(i.desc)}</p><p>Files that are in use are skipped.</p>`, "Clean", true);
    if (!ok) return;
  }
  try {
    const r = await api("cleanup_run", { id: i.id });
    if (r.error) return toast(r.error, "error");
    if (r.launched) toast("Opened Windows Disk Cleanup", "ok", "Tick “Clean up system files” there for Windows Update leftovers.");
    else toast(`Freed ${fmt(r.freed || 0)}`, "ok", r.skipped ? `${r.skipped.toLocaleString()} items were in use or protected and were skipped.` : "");

  } catch (e) { toast(e.message, "error"); }
}

function drawDupeBody() {

  const size = a.size ? `${fmt(a.size)}<small>${a.sizeFrom === "scan" ? "measured" : "estimated by the app"}</small>` : `<small>size unknown</small>`;
  const un = a.uninstall === "command"
    ? `<button class="btn" data-copy-cmd="${esc(a.cmd)}" onclick="copyText(this.dataset.copyCmd).then(ok => toast(ok ? 'Command copied' : 'Couldn\\'t copy', 'ok', 'Run it in a terminal.'))">${ICON.copy}Copy uninstall command</button>`
    : `<button class="btn danger" data-un="${a.id}">${ICON.trash}Uninstall</button>`;
  const rel = S.appOpen[a.id];
  let relHTML = "";
  if (rel === "loading") relHTML = `<div class="cands"><div class="loading">${SPIN}Looking for related folders…</div></div>`;
  else if (Array.isArray(rel)) {
    const set = S.appSel[a.id] || new Set(), sel = rel.reduce((t, r, i) => t + (set.has(i) ? r.size : 0), 0);
    relHTML = `<div class="cands">${rel.length ? rel.map((r, i) => `<label class="cand"><input type="checkbox" data-rc="${a.id}|${i}" ${set.has(i) ? "checked" : ""}>
        <span class="cp" title="${esc(r.path)}">${esc(r.path)}</span><span class="cz">${fmt(r.size)}</span></label>`).join("")
      + `<div class="cand-actions"><button class="btn primary" data-rstage="${a.id}" ${set.size ? "" : "disabled"}>${ICON.stage}Stage ${set.size ? `${set.size} (${fmt(sel)})` : "selected"}</button>
         <span>These are matched by name, so check them. They may hold settings or saved data you want to keep.</span></div>`
      : `<div class="tnote">No related folders found.</div>`}</div>`;
  }
  return `<div class="app"><i></i><span class="an" title="${esc(a.name)}">${esc(a.name)}</span><span class="as num">${size}</span>
    <span class="aa"><button class="btn" data-rel="${a.id}">${rel && rel !== "loading" ? "Hide related" : "Related folders"}</button>
      ${a.location ? `<button class="btn ghost icon" data-show="${esc(a.location)}" title="Show in ${S.revealName}">${ICON.open}</button>` : ""}${un}</span>
    <span class="am">${esc([a.publisher, a.version && "v" + a.version, a.date && /^\d{8}$/.test(a.date) ? "installed " + a.date.slice(0, 4) + "-" + a.date.slice(4, 6) + "-" + a.date.slice(6) : ""].filter(Boolean).join(" · "))}</span>${relHTML}</div>`;
}
async function toggleRelated(id) {
  if (S.appOpen[id] && S.appOpen[id] !== "loading") { delete S.appOpen[id]; return drawApps(); }
  S.appOpen[id] = "loading"; drawApps();
  try { const r = await api("app_related", { id }); S.appOpen[id] = r.items; S.appSel[id] = new Set(); }
  catch (e) { delete S.appOpen[id]; toast(e.message, "error"); }
  drawApps();
}
async function uninstallApp(a) {
  if (!a) return;
  if (a.uninstall === "trash") {
    const r = await api("app_uninstall", { id: a.id });
    if (r.error) return toast(r.error, "error");
    toast(`Staged ${a.name}`, "ok", "Check Related folders too, then move everything to the Trash from the staging area.", { label: "Review", run: () => toggleDrawer(true) });
    return loadStaged();
  }
  const ok = await confirmDialog(`Uninstall ${a.name}?`, `<p>Hoard starts ${esc(a.name)}'s own uninstaller. Follow its steps; Windows may ask for permission first.</p>
    <p>When it's done, use <b>Related folders</b> to find anything it left behind.</p>`, "Start uninstaller", true);
  if (!ok) return;
  const r = await api("app_uninstall", { id: a.id });
  if (r.error) toast(r.error, "error"); else toast(`Started the uninstaller for ${a.name}`, "ok", "Press Refresh here when it's finished.");
}

/* ------------------------------------------------------------------ boot */
async function refreshDrives() {
  try {
    const r = await api("drives");
    Object.assign(S, { drives: r.drives, os: r.os, sep: r.sep, trashName: r.trashName, revealName: r.revealName,
                       ignore: r.ignore || {}, watch: r.watch || [], hiddenNote: r.hiddenNote || "" });
    document.documentElement.dataset.os = r.os;
    if (r.theme !== S.theme) applyTheme(r.theme);
  } catch (e) { toast(e.message, "error"); }
  renderDrives();
}
async function loadHistory() {
  try { S.hist = await api("history", { drive: S.drive }); } catch { S.hist = null; }
  if (S.view) renderCrumbs();
}
async function selectDrive(L) {
  S.drive = L; S.path = []; S.view = null; S.sel = null; S.focusCat = null; S.lists = {}; S.meta = null; S.hist = null;
  S.rects = []; draw(); drawOverlay();
  renderAll(); showState("loading");
  try { S.meta = await api("open_drive", { drive: L }); } catch (e) { toast(e.message, "error"); return; }
  renderStatus();
  if (!S.meta.has) { showState("empty"); renderAll(); return; }
  await loadHistory();
  await loadView([]);
}
$("#scanBtn").onclick = startScan;

/* a scheduled scan may have run while Hoard was open: pick it up */
async function checkForNewScan() {
  if (S.scanning || !S.drive || !S.meta?.has || $("#dlg").open) return;
  await refreshDrives();
  const v = S.drives.find(d => d.id === S.drive);
  if (v && v.scanned && v.scanned !== S.meta.time) {
    S.meta = await api("open_drive", { drive: S.drive });
    await loadHistory();
    await loadView(S.path);
    toast(`Loaded the newer scan from ${when(v.scanned)}`);
  }
}
addEventListener("focus", checkForNewScan);
setInterval(checkForNewScan, 120000);

/* ------------------------------------------------------------------ theme & settings */
function applyTheme(t) {
  S.theme = t;
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
  readColors();
  if (S.view) { draw(); drawOverlay(); renderComp(); }
}
function nextRun(hm) {
  const [h, m] = hm.split(":").map(Number), n = new Date(), t = new Date();
  t.setHours(h, m, 0, 0);
  const today = t > n;
  return `${today ? "today" : "tomorrow"} at ${t.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" })}`;
}
async function openSettings() {
  let r;
  try { r = await api("settings"); } catch (e) { return toast(e.message, "error"); }
  const st = r.settings, d = $("#dlg"), themeBefore = S.theme;
  let theme = st.theme, saved = false;
  const disks = S.drives.filter(x => x.type !== "folder");
  const chosen = new Set(st.schedule.volumes.length ? st.schedule.volumes : [S.drive]);
  const opt = (vals, cur, label) => vals.map(v => `<option value="${v}" ${+v === +cur ? "selected" : ""}>${label(v)}</option>`).join("");
  const report = (r.report || []).map(e => {
    const top = e.top && e.top[0];
    const change = e.delta === undefined ? `${fmt(e.total)} scanned` : `${e.delta >= 0 ? "▲" : "▼"} ${fmt(Math.abs(e.delta))}`;
    return `<div><span>${esc(when(e.time))}</span><span>${esc(e.name)} · ${change}${top ? ` · ${esc(top.p[top.p.length - 1])} +${fmt(top.d)}` : ""}</span></div>`;
  }).join("");
  const sch = r.schedule;
  d.classList.add("wide");
  d.innerHTML = `<h3>Settings</h3>
    <section class="set">
      <div class="set-row"><div><b>Scan automatically every day</b><small>${esc(r.scheduleNote)}</small></div>
        <label class="switch"><input type="checkbox" id="stOn" ${st.schedule.enabled ? "checked" : ""} aria-label="Scan automatically every day"><span></span></label></div>
      <div class="set-sub ${st.schedule.enabled ? "" : "off"}" id="stSub">
        <div class="field"><span>Time</span><input type="time" id="stTime" value="${esc(st.schedule.time)}" required></div>
        <div class="field"><span>Disks</span><div class="checks">${disks.map(v =>
          `<label><input type="checkbox" value="${esc(v.id)}" ${chosen.has(v.id) ? "checked" : ""}>${esc(v.name)}</label>`).join("")}</div></div>
        <div class="status-line ${sch.installed ? "ok" : st.schedule.enabled ? "warn" : ""}" id="stStatus">${
          sch.installed ? `Scheduled — next scan ${nextRun(st.schedule.time)}` : st.schedule.enabled ? "Not registered with the system yet. Save to try again." : "Off"}</div>
      </div>
    </section>
    <section class="set"><div class="set-row"><div><b>Tell me when a disk grows by more than</b><small>Checked after each daily scan. Shows a system notification.</small></div>
      <select id="stNotify">${opt([0, 0.5, 1, 2, 5, 10], st.notifyGB, v => +v ? (v < 1 ? v * 1000 + " MB" : v + " GB") : "Never")}</select></div></section>
    <section class="set"><div class="set-row"><div><b>Keep scan history</b><small>Older scans are deleted automatically. Saved scans now use ${fmt(r.storage)}.</small></div>
      <select id="stKeep">${opt([7, 14, 30, 60, 90], st.keep, v => v + " scans")}</select></div></section>
    <section class="set"><div class="set-row"><div><b>Save a report after each daily scan</b><small>An HTML page listing what grew and the largest folders and files, saved to ${esc(st.reportDir || r.defaultReportDir)}.</small></div>
      <label class="switch"><input type="checkbox" id="stReport" ${st.reportDir ? "checked" : ""} aria-label="Save a report after each daily scan"><span></span></label></div>
      ${st.reportDir ? `<button class="btn" id="stOpenReports" style="margin-top:10px">Open reports folder</button>` : ""}</section>
    <section class="set"><b>Ignored folders</b><small>Hidden from the map, lists, search and duplicates (they're still scanned). Right-click anything on the map to ignore it.</small>
      <div class="report" id="stIgn"></div></section>
    <section class="set"><b>Size alerts</b><small>A notification after a daily scan when a folder first passes its limit. Right-click a folder on the map to add one.</small>
      <div class="report" id="stWatch"></div></section>
    <section class="set"><div class="set-row"><div><b>Appearance</b></div>
      <div class="seg" id="stTheme">${["system", "light", "dark"].map(t => `<button type="button" data-t="${t}" aria-pressed="${t === theme}">${t[0].toUpperCase() + t.slice(1)}</button>`).join("")}</div></div></section>
    ${report ? `<section class="set"><b>Recent automatic scans</b><div class="report">${report}</div></section>` : ""}
    <div class="form-error" id="stErr" hidden></div>
    <div class="row-actions"><button class="btn" id="stCancel">Cancel</button><button class="btn primary" id="stSave">Save</button></div>`;
  const on = $("#stOn");
  on.onchange = () => $("#stSub").classList.toggle("off", !on.checked);
  const ign = JSON.parse(JSON.stringify(st.ignore || {}));
  let watch = [...(st.watch || [])];
  const drawLists = () => {
    const rows = [];
    for (const [vid, keys] of Object.entries(ign)) keys.forEach(k => rows.push({ vid, k }));
    $("#stIgn").innerHTML = rows.length ? rows.map((x, i) => `<div><span>${esc(volOf(x.vid)?.name || x.vid)}</span><span style="flex:1" title="${esc(x.k)}">${esc(x.k.split("/").join(" › "))}</span>
        <button class="xbtn" data-ign="${i}" aria-label="Stop ignoring">✕</button></div>`).join("") : `<div><span>None</span></div>`;
    $("#stWatch").innerHTML = watch.length ? watch.map((w, i) => `<div><span>${esc(volOf(w.vol)?.name || w.vol)}</span><span style="flex:1">${esc(w.path.join(" › ") || "whole disk")} · over ${w.gb} GB</span>
        <button class="xbtn" data-w="${i}" aria-label="Remove alert">✕</button></div>`).join("") : `<div><span>None</span></div>`;
    d.querySelectorAll("[data-ign]").forEach(b => b.onclick = () => {
      const x = rows[+b.dataset.ign]; ign[x.vid] = ign[x.vid].filter(k => k !== x.k); if (!ign[x.vid].length) delete ign[x.vid]; drawLists();
    });
    d.querySelectorAll("[data-w]").forEach(b => b.onclick = () => { watch.splice(+b.dataset.w, 1); drawLists(); });
  };
  drawLists();
  const orf = $("#stOpenReports");
  if (orf) orf.onclick = () => api("open_folder", { which: "reports" }).then(x => x.error && toast(x.error, "error"));
  d.querySelectorAll("#stTheme button").forEach(b => b.onclick = () => {
    theme = b.dataset.t; applyTheme(theme);
    d.querySelectorAll("#stTheme button").forEach(x => x.setAttribute("aria-pressed", x === b));
  });
  $("#stCancel").onclick = () => d.close();
  $("#stSave").onclick = async () => {
    const err = $("#stErr"), btn = $("#stSave");
    const body = { settings: {
      schedule: { enabled: on.checked, time: $("#stTime").value,
                  volumes: [...d.querySelectorAll(".checks input:checked")].map(x => x.value) },
      notifyGB: +$("#stNotify").value, keep: +$("#stKeep").value, theme,
      ignore: ign, watch, reportDir: $("#stReport").checked ? (st.reportDir || r.defaultReportDir) : "" } };
    btn.disabled = true; err.hidden = true;
    try {
      const res = await api("save_settings", body);
      if (res.error) { err.textContent = res.error; err.hidden = false; btn.disabled = false; return; }
      saved = true; d.close();
      const ignChanged = JSON.stringify(res.settings.ignore) !== JSON.stringify(S.ignore);
      S.ignore = res.settings.ignore; S.watch = res.settings.watch;
      if (ignChanged && S.view) loadView(S.path, { force: true }); else if (S.view) renderSel();
      toast(on.checked ? `Daily scan set for ${nextRun(body.settings.schedule.time)} and every day after` : "Settings saved");
    } catch (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; }
  };
  d.onclose = () => { d.classList.remove("wide"); d.onclose = null; if (!saved && S.theme !== themeBefore) applyTheme(themeBefore); };
  d.showModal();
}
$("#settingsBtn").onclick = openSettings;

setInterval(() => api("ping").catch(() => {}), 20000);
addEventListener("pagehide", () => navigator.sendBeacon("/api/bye", ""));

(async () => {
  sizeCanvas(); readColors();
  try { if (localStorage.getItem("hoard.colorBy") === "age") S.colorBy = "age"; } catch { /* private mode */ }
  await refreshDrives();
  loadStaged();
  const running = await api("progress").catch(() => ({}));
  const sys = (running.running && S.drives.find(d => d.id === running.drive))
    || S.drives.find(d => d.id === "C" || d.id === "root") || S.drives[0];
  if (!sys) return showStateMessage("No disks found", "Hoard couldn't find any disks it can read.");
  await selectDrive(sys.id);
  if (running.running) {            // the window was reloaded mid-scan: pick the scan back up
    S.scanning = true; S.scanMin = !!S.view; S.lastProg = running;
    if (S.scanMin) updateScanUI(running); else showState("scan");
    renderAll(); poll();
  }
})();
</script>
</body>
</html>
